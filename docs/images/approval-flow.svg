<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="405" viewBox="0 0 1280 405" role="img"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8292AC" stroke-width="1.5"/></marker></defs><rect width="1280" height="405" rx="24" fill="#F3F6FC"/>
<text x="42" y="51" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#172B4D">一次提问，四个步骤</text>
<text x="42" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#63738C">只有你在扩展中确认的准确问题，才会进入提交步骤。</text>
<rect x="42" y="126" width="274" height="182" rx="16" fill="#FFFFFF" stroke="#DCE4F0"/>
<rect x="60" y="144" width="43" height="32" rx="8" fill="#EAF1FF" stroke="none"/>
<text x="69" y="167" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#426CC3">01</text>
<text x="60" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172B4D">准备问题</text>
<text x="60" y="246" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#4F617D">返回 requestId</text>
<text x="60" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#63738C">尚未填入或发送</text>
<path d="M321,216 L341,216" stroke="#8292AC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="349" y="126" width="274" height="182" rx="16" fill="#FFFFFF" stroke="#DCE4F0"/>
<rect x="367" y="144" width="43" height="32" rx="8" fill="#EAF1FF" stroke="none"/>
<text x="376" y="167" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#426CC3">02</text>
<text x="367" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172B4D">弹窗确认</text>
<text x="367" y="246" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#4F617D">核对论文与完整问题</text>
<text x="367" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#63738C">10 分钟内有效</text>
<path d="M628,216 L648,216" stroke="#8292AC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="656" y="126" width="274" height="182" rx="16" fill="#FFFFFF" stroke="#DCE4F0"/>
<rect x="674" y="144" width="43" height="32" rx="8" fill="#EAF1FF" stroke="none"/>
<text x="683" y="167" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#426CC3">03</text>
<text x="674" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172B4D">提交一次</text>
<text x="674" y="246" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#4F617D">沿用原 requestId</text>
<text x="674" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#63738C">失败也不自动重发</text>
<path d="M935,216 L955,216" stroke="#8292AC" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="963" y="126" width="274" height="182" rx="16" fill="#FFFFFF" stroke="#DCE4F0"/>
<rect x="981" y="144" width="43" height="32" rx="8" fill="#EAF1FF" stroke="none"/>
<text x="990" y="167" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" fill="#426CC3">04</text>
<text x="981" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#172B4D">读取回复</text>
<text x="981" y="246" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#4F617D">读取已有 AI 内容</text>
<text x="981" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" fill="#63738C">生成中可稍后再读</text>
<text x="42" y="365" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#63738C">读取已有摘要与对话无需准备新问题；发送新问题可能消耗 Moonlight 额度。</text></svg>
